<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答助手 - 数字顾问团</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #1a1c23;
            color: #e8e8e8;
            height: 100vh;
            display: flex;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: #23252d;
            border-right: 1px solid #2d3139;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #2d3139;
        }

        .sidebar-header h1 {
            font-size: 18px;
            color: #c2a38a;
            margin-bottom: 8px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: #6b7280;
        }

        .new-agent-btn {
            margin: 16px 20px;
            padding: 10px 16px;
            background: #2d5a5a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .new-agent-btn:hover {
            background: #3d7a7a;
        }

        .agent-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .agent-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #2a2d36;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .agent-item:hover {
            background: #323641;
        }

        .agent-item.active {
            border-color: #2d5a5a;
            background: #2a3d3d;
        }

        .agent-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .agent-info {
            font-size: 12px;
            color: #6b7280;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 顶部工具栏 */
        .toolbar {
            height: 60px;
            background: #23252d;
            border-bottom: 1px solid #2d3139;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .toolbar-btn {
            padding: 8px 16px;
            background: #2a2d36;
            border: 1px solid #3d4149;
            color: #e8e8e8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .toolbar-btn:hover {
            background: #323641;
        }

        .toolbar-btn.primary {
            background: #2d5a5a;
            border-color: #2d5a5a;
        }

        .toolbar-btn.primary:hover {
            background: #3d7a7a;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #e8e8e8;
        }

        .tab.active {
            color: #c2a38a;
            border-bottom-color: #c2a38a;
        }

        /* 内容区域 */
        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        /* 知识库页面 */
        .knowledge-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .knowledge-header h2 {
            font-size: 18px;
            font-weight: 500;
        }

        .upload-area {
            border: 2px dashed #3d4149;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 24px;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: #2d5a5a;
            background: #2a2d36;
        }

        .upload-area.dragover {
            border-color: #c2a38a;
            background: #3d3530;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
        }

        .upload-hint {
            font-size: 12px;
            color: #4b5563;
        }

        .document-list {
            display: grid;
            gap: 12px;
        }

        .document-item {
            background: #2a2d36;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .document-icon {
            width: 40px;
            height: 40px;
            background: #2d5a5a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .document-info {
            flex: 1;
        }

        .document-name {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .document-meta {
            font-size: 12px;
            color: #6b7280;
        }

        .document-actions {
            display: flex;
            gap: 8px;
        }

        .doc-btn {
            padding: 6px 12px;
            background: #3d4149;
            border: none;
            color: #e8e8e8;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .doc-btn:hover {
            background: #4b5563;
        }

        .doc-btn.delete {
            background: #5c3d3d;
        }

        .doc-btn.delete:hover {
            background: #7a4d4d;
        }

        /* 对话页面 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
        }

        .message.user {
            align-self: flex-end;
            background: #2d5a5a;
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
            background: #2a2d36;
            border: 1px solid #3d4149;
        }

        .message-sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #3d4149;
            font-size: 12px;
            color: #6b7280;
        }

        .message-source {
            margin-top: 8px;
            padding: 8px;
            background: #23252d;
            border-radius: 6px;
        }

        .source-title {
            color: #c2a38a;
            margin-bottom: 4px;
        }

        .source-content {
            color: #9ca3af;
            font-size: 11px;
            line-height: 1.4;
        }

        .chat-input-area {
            padding: 16px 20px;
            background: #23252d;
            border-top: 1px solid #2d3139;
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: #2a2d36;
            border: 1px solid #3d4149;
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            font-family: inherit;
        }

        .chat-input:focus {
            outline: none;
            border-color: #2d5a5a;
        }

        .chat-input::placeholder {
            color: #6b7280;
        }

        .send-btn {
            padding: 12px 20px;
            background: #2d5a5a;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: #3d7a7a;
        }

        .send-btn:disabled {
            background: #3d4149;
            cursor: not-allowed;
        }

        /* 欢迎页面 */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #c2a38a;
        }

        .welcome p {
            font-size: 14px;
            color: #6b7280;
            max-width: 400px;
            line-height: 1.6;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #23252d;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            border: 1px solid #3d4149;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .modal-header p {
            font-size: 13px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #9ca3af;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #2a2d36;
            border: 1px solid #3d4149;
            border-radius: 6px;
            color: #e8e8e8;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #2d5a5a;
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: #3d4149;
            color: #e8e8e8;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-primary {
            background: #2d5a5a;
            color: white;
        }

        .btn-primary:hover {
            background: #3d7a7a;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #3d4149;
            border-top-color: #2d5a5a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #2a2d36;
            border-radius: 12px;
            align-self: flex-start;
            border: 1px solid #3d4149;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #6b7280;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #e8e8e8;
        }

        .empty-state p {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>🤖 智能问答助手</h1>
            <p>基于材料内容的智能对话</p>
        </div>
        <button class="new-agent-btn" onclick="showCreateAgentModal()">+ 新建助手</button>
        <div class="agent-list" id="agentList">
            <!-- 动态加载Agent列表 -->
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 工具栏 -->
        <div class="toolbar" id="toolbar" style="display: none;">
            <button class="toolbar-btn primary" onclick="createConversation()">+ 新对话</button>
            <div class="tabs">
                <button class="tab active" onclick="switchTab('chat')">💬 对话</button>
                <button class="tab" onclick="switchTab('knowledge')">📚 知识库</button>
            </div>
        </div>

        <!-- 内容区域 -->
        <div class="content">
            <!-- 欢迎页面 -->
            <div class="welcome" id="welcomePage">
                <h2>欢迎使用智能问答助手</h2>
                <p>创建一个问答助手，上传你的材料，然后开始智能对话。助手会基于你提供的材料内容回答问题，就像 Kimi、豆包一样智能。</p>
            </div>

            <!-- 对话页面 -->
            <div class="tab-content active" id="chatTab">
                <div class="chat-container" id="chatContainer" style="display: none;">
                    <div class="chat-messages" id="chatMessages">
                        <!-- 动态加载消息 -->
                    </div>
                    <div class="chat-input-area">
                        <div class="chat-input-container">
                            <textarea 
                                class="chat-input" 
                                id="chatInput" 
                                placeholder="输入你的问题..."
                                rows="1"
                                onkeydown="handleInputKeydown(event)"
                            ></textarea>
                            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 知识库页面 -->
            <div class="tab-content" id="knowledgeTab">
                <div class="knowledge-header">
                    <h2>📚 知识库</h2>
                </div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">拖拽文件到此处，或点击上传</div>
                    <div class="upload-hint">支持 PDF、TXT、Markdown 格式</div>
                    <input type="file" id="fileInput" style="display: none;" accept=".pdf,.txt,.md,.markdown" onchange="handleFileSelect(event)">
                </div>
                <div class="document-list" id="documentList">
                    <!-- 动态加载文档列表 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 创建Agent模态框 -->
    <div class="modal" id="createAgentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>新建问答助手</h3>
                <p>创建一个基于材料内容的智能问答助手</p>
            </div>
            <div class="form-group">
                <label class="form-label">助手名称</label>
                <input type="text" class="form-input" id="agentName" placeholder="例如：产品手册助手">
            </div>
            <div class="form-group">
                <label class="form-label">描述（可选）</label>
                <textarea class="form-input form-textarea" id="agentDescription" placeholder="描述这个助手的用途..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="hideCreateAgentModal()">取消</button>
                <button class="btn btn-primary" onclick="submitCreateAgent()">创建</button>
            </div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE_URL = 'http://localhost:8000';
        
        // 全局状态
        let currentAgent = null;
        let currentConversation = null;
        let agents = [];
        let isStreaming = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadAgents();
            setupDragAndDrop();
        });

        // ============ Agent管理 ============

        async function loadAgents() {
            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents`);
                agents = await response.json();
                renderAgentList();
            } catch (error) {
                console.error('加载Agent列表失败:', error);
            }
        }

        function renderAgentList() {
            const list = document.getElementById('agentList');
            if (agents.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🤖</div>
                        <h3>还没有助手</h3>
                        <p>点击上方按钮创建你的第一个问答助手</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = agents.map(agent => `
                <div class="agent-item ${currentAgent?.agent_id === agent.agent_id ? 'active' : ''}" 
                     onclick="selectAgent('${agent.agent_id}')">
                    <div class="agent-name">${agent.name}</div>
                    <div class="agent-info">${agent.document_count} 个文档 · ${agent.conversation_count} 个对话</div>
                </div>
            `).join('');
        }

        async function selectAgent(agentId) {
            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents/${agentId}`);
                currentAgent = await response.json();
                
                // 更新UI
                renderAgentList();
                document.getElementById('welcomePage').style.display = 'none';
                document.getElementById('toolbar').style.display = 'flex';
                document.getElementById('chatContainer').style.display = 'flex';
                
                // 加载知识库
                loadDocuments();
                
                // 创建新对话
                createConversation();
            } catch (error) {
                console.error('选择Agent失败:', error);
                alert('加载助手失败');
            }
        }

        function showCreateAgentModal() {
            document.getElementById('createAgentModal').classList.add('active');
        }

        function hideCreateAgentModal() {
            document.getElementById('createAgentModal').classList.remove('active');
            document.getElementById('agentName').value = '';
            document.getElementById('agentDescription').value = '';
        }

        async function submitCreateAgent() {
            const name = document.getElementById('agentName').value.trim();
            const description = document.getElementById('agentDescription').value.trim();

            if (!name) {
                alert('请输入助手名称');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });

                const result = await response.json();
                hideCreateAgentModal();
                loadAgents();
                
                // 自动选择新创建的Agent
                selectAgent(result.agent_id);
            } catch (error) {
                console.error('创建Agent失败:', error);
                alert('创建助手失败');
            }
        }

        // ============ 对话管理 ============

        async function createConversation() {
            if (!currentAgent) return;

            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents/${currentAgent.agent_id}/conversations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: '' })
                });

                currentConversation = await response.json();
                
                // 清空消息列表
                document.getElementById('chatMessages').innerHTML = '';
                
                // 添加欢迎消息
                addMessage('assistant', `你好！我是 **${currentAgent.name}**。我已经学习了你上传的材料，现在可以基于这些内容回答你的问题。请问有什么可以帮助你的？`);
            } catch (error) {
                console.error('创建对话失败:', error);
            }
        }

        function addMessage(role, content, sources = []) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            let html = content;
            
            // 添加引用来源
            if (sources && sources.length > 0) {
                html += `
                    <div class="message-sources">
                        <div>📚 参考来源：</div>
                        ${sources.map(source => `
                            <div class="message-source">
                                <div class="source-title">${source.source}</div>
                                <div class="source-content">${source.content}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            messageDiv.innerHTML = html;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            return messageDiv;
        }

        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chatMessages');
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            if (isStreaming || !currentAgent || !currentConversation) return;

            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;

            // 清空输入框
            input.value = '';
            input.style.height = 'auto';

            // 添加用户消息
            addMessage('user', message);

            // 显示输入指示器
            showTypingIndicator();

            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents/${currentAgent.agent_id}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        conversation_id: currentConversation.conversation_id,
                        stream: true
                    })
                });

                hideTypingIndicator();

                // 创建助手消息容器
                const messageDiv = addMessage('assistant', '');
                let fullContent = '';

                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;

                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    fullContent += parsed.content;
                                    messageDiv.innerHTML = fullContent;
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('发送消息失败:', error);
                hideTypingIndicator();
                addMessage('assistant', '抱歉，发送消息时出现错误，请稍后重试。');
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function handleInputKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // 自动调整输入框高度
        document.getElementById('chatInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ============ 知识库管理 ============

        async function loadDocuments() {
            if (!currentAgent) return;

            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents/${currentAgent.agent_id}/documents`);
                const documents = await response.json();
                renderDocumentList(documents);
            } catch (error) {
                console.error('加载文档列表失败:', error);
            }
        }

        function renderDocumentList(documents) {
            const list = document.getElementById('documentList');
            if (documents.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📄</div>
                        <h3>知识库为空</h3>
                        <p>上传文档或网页，让助手学习材料内容</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = documents.map(doc => `
                <div class="document-item">
                    <div class="document-icon">${getDocumentIcon(doc.doc_type)}</div>
                    <div class="document-info">
                        <div class="document-name">${doc.source}</div>
                        <div class="document-meta">${doc.doc_type.toUpperCase()} · ${doc.chunk_count} 个片段 · ${formatFileSize(doc.char_count)}</div>
                    </div>
                    <div class="document-actions">
                        <button class="doc-btn delete" onclick="deleteDocument('${doc.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function getDocumentIcon(type) {
            const icons = {
                'pdf': '📕',
                'txt': '📄',
                'markdown': '📝',
                'html': '🌐'
            };
            return icons[type] || '📄';
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function setupDragAndDrop() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');

            uploadArea.addEventListener('click', () => fileInput.click());

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    uploadFile(files[0]);
                }
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        async function uploadFile(file) {
            if (!currentAgent) {
                alert('请先选择一个助手');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE_URL}/qa/agents/${currentAgent.agent_id}/documents`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                alert(result.message);
                loadDocuments();
            } catch (error) {
                console.error('上传文档失败:', error);
                alert('上传文档失败');
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('确定要删除这个文档吗？')) return;

            try {
                await fetch(`${API_BASE_URL}/qa/agents/${currentAgent.agent_id}/documents/${docId}`, {
                    method: 'DELETE'
                });
                loadDocuments();
            } catch (error) {
                console.error('删除文档失败:', error);
                alert('删除文档失败');
            }
        }

        // ============ 标签页切换 ============

        function switchTab(tabName) {
            // 更新标签按钮状态
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // 更新内容显示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        // 点击模态框外部关闭
        document.getElementById('createAgentModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                hideCreateAgentModal();
            }
        });
    </script>
</body>
</html>
