<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="BGcSwys8FCG0RZikO4lIDW">
<head data-page-node-id="neYrZgi0gHcC2SEcDzqHLx">
<meta charset="UTF-8" data-page-node-id="mJKTpFJ5osjMPsqBweQuL0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="lnGNd175ffJJ9bwyDOjjXu" />
<title>原则复盘 · Principle Retro</title>
<!-- 双击本文件即可打开，无需安装任何环境。数据保存在浏览器本地。 -->
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e6e8ec; --sub:#9aa3b2; --accent:#6ea8fe; --good:#4ec9a8;
    --warn:#f0a35e; --bad:#e06c75; --dim:#5b6472;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.6;font-size:14px}
  header{padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:600}
  header .tag{color:var(--sub);font-size:12px}
  nav{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--sub);padding:12px 14px;
    cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
  nav button.active{color:var(--txt);border-bottom-color:var(--accent)}
  main{padding:20px 22px;max-width:920px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
  input[type=text],textarea,select{width:100%;background:var(--panel2);
    border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical}
  textarea{min-height:64px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .step .n{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;
    background:var(--accent);color:#0f1115;border-radius:50%;font-size:12px;font-weight:700;margin-right:8px}
  .step h3{font-size:14px;font-weight:600;display:inline}
  .switch{display:flex;align-items:center;gap:10px;margin:14px 0}
  .switch input{width:18px;height:18px;accent-color:var(--bad)}
  .pain{background:#2a1d22;border:1px solid #5a2a33;border-radius:10px;padding:14px 16px;margin-top:10px}
  .pain label{color:var(--bad)}
  .btn{background:var(--accent);color:#0f1115;border:none;padding:10px 18px;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .card .meta{color:var(--dim);font-size:12px;margin-top:8px}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px}
  .pill.dev{background:#3a2a2a;color:var(--bad)}
  .pill.ok{background:#1f3a30;color:var(--good)}
  .pill.ob{background:var(--panel2);color:var(--dim)}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  /* evolution tree */
  .tree{position:relative;padding-left:30px}
  .tree::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .node{position:relative;margin-bottom:14px}
  .node::before{content:"";position:absolute;left:-19px;top:10px;width:12px;height:12px;
    border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
  .node.ob::before{background:var(--dim)}
  .node .txt{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .node .d{color:var(--dim);font-size:12px;margin-top:4px}
  .hint{color:var(--dim);font-size:12px;margin:8px 0}
  code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body data-page-node-id="jcQAiCgZVM11ZKzWAzs8Qh">
<header data-page-node-id="rskcNDaly5DQmMpplKJujV">
  <h1 data-page-node-id="p5OCEuJ69QnoI4JiRbxIWG">原则复盘</h1>
  <span class="tag" data-page-node-id="4zQQSOqwfvHUXzwBe8l48G">Principle Retro · 个人原则引擎 · 单机本地</span>
</header>
<nav data-page-node-id="JnFniOAF8FNll7i3wQMCyl">
  <button data-v="write" class="active" data-page-node-id="fvOiM4SQFFxdxrBJhbhRBn">复盘录入</button>
  <button data-v="list" data-page-node-id="a1Y7HQz2qxoAFo1hrxaw8A">复盘记录</button>
  <button data-v="principles" data-page-node-id="v5cNTwyNz8AEfabvmGL6RL">原则库</button>
  <button data-v="tree" data-page-node-id="ZSAEjQZKaeIFo5IWDG8yNp">演化树</button>
  <button data-v="data" data-page-node-id="qwIBBW0nqCVAfPtOJCZnau">数据</button>
</nav>
<main data-page-node-id="K9zRxmTYNFvJTpmrceyY00">
  <!-- 复盘录入 -->
  <section id="write" class="view active" data-page-node-id="fhnUPXNV8wRvbxJHrgd91r">
    <div class="hint" data-page-node-id="7kBJMZwB4okKWnBH7z5dAs">五步流程：目标 → 问题 → 根因 → 方案 → 执行。每步分开写，别混着做。</div>
    <label data-page-node-id="UcoZto77tU4mjmD7EMzp3g">复盘主题</label>
    <input type="text" id="topic" placeholder="例如：这周求职进度卡住了 / 五字日记连续3天没写" data-page-node-id="x5vyzdJsIH0Ja02BMXTccO" />
    <div class="step" data-page-node-id="39kD3HCnNyf80u0NYZWfJD">
      <span class="n" data-page-node-id="K111b1kvpmxromuLVAvS2N">1</span><h3 data-page-node-id="6wLFl61ve9r7RQKbCrsCmA">目标</h3>
      <label style="margin-top:8px" data-page-node-id="Mna0rIz4TAWUXB76tqyLPB">当时想达成什么（可量化）</label>
      <textarea id="goal" placeholder="把模糊目标拆成可量化指标"></textarea>
    </div>
    <div class="step" data-page-node-id="rJTCZqG3A9UN0JeQsLR5sw">
      <span class="n" data-page-node-id="LvUM6L0QGmJAwUzCfW94T4">2</span><h3 data-page-node-id="kCUklWAjks2QFq4c8AT0sD">问题</h3>
      <label style="margin-top:8px" data-page-node-id="IL3XXO9hUVwWFVZ3TDcJjY">阻碍目标的问题（不容忍）</label>
      <textarea id="problem" placeholder="列出当前阻碍"></textarea>
    </div>
    <div class="step" data-page-node-id="CsxNPVj31NfViYePINXOa6">
      <span class="n" data-page-node-id="lAdu5zzk66qHgrYxFME5fa">3</span><h3 data-page-node-id="PrUERyNIL8DvwaA77IVIs1">根因</h3>
      <label style="margin-top:8px" data-page-node-id="uRSPa1prdxO1GvCD30hYAC">用 5 Whys 追问到根本（不是症状）</label>
      <textarea id="root" placeholder="问题的真正根源，而非表面现象"></textarea>
    </div>
    <div class="step" data-page-node-id="NlOqimcqxSnT8cOjnptuyV">
      <span class="n" data-page-node-id="REU9nJUSOGpxCnnT3fNhTb">4</span><h3 data-page-node-id="UVWBxf0Nl6GYMyf6OFPnTM">方案</h3>
      <label style="margin-top:8px" data-page-node-id="La4imxwKTk0qwWBfzrnsJN">设计解决路径</label>
      <textarea id="plan" placeholder="类似情境下验证过的策略"></textarea>
    </div>
    <div class="step" data-page-node-id="ixcesgao2HHLlWQwaG5qYE">
      <span class="n" data-page-node-id="roaA9FRvpVeXnSHNsDlPP2">5</span><h3 data-page-node-id="WPhfYVPNV9pAZZ5aty8icC">执行</h3>
      <label style="margin-top:8px" data-page-node-id="FjTCuaObph7vXJNXE0LUx7">实际做了什么 / 结果如何</label>
      <textarea id="exec" placeholder="执行结果，用于下次回检"></textarea>
    </div>
    <div class="switch" data-page-node-id="8B0IcdCZ6Dg3n05qoti9yB">
      <input type="checkbox" id="deviation" data-page-node-id="NGXast406QTZ1sKNBlmyYq" />
      <label style="margin:0;color:var(--txt)" data-page-node-id="reAQn3LZOjmmp1oobVpyDe">本次出现偏差（执行没达预期 / 计划被打断）</label>
    </div>
    <div class="pain" id="painBox" style="display:none" data-page-node-id="W0QN8GlTzeN7O2Ui9C87b2">
      <label data-page-node-id="W4DqTzVHUfEpkCg63kaGhr">痛苦 + 反思 = 进步</label>
      <textarea id="pain" placeholder="偏差暴露出我哪条原则要更新？写一句真正的反思，不写不能提交。"></textarea>
      <div class="hint" data-page-node-id="kEZRTyO1KITa5kDzpTeE7D">这句反思会落进你的原则库，成为下次决策的「可信来源」。</div>
    </div>
    <div class="row" data-page-node-id="33z22CSlhehOCrM6xU7x5e">
      <button class="btn" id="saveReview" data-page-node-id="JPvQXsbcKtaCSDCunDshYF">保存复盘</button>
      <button class="btn ghost" id="resetForm" data-page-node-id="q5Ti2tPgWNAgrE87vOhELd">清空</button>
    </div>
  </section>

  <!-- 复盘记录 -->
  <section id="list" class="view" data-page-node-id="kiofArzVUN5wLSI5eaSItu">
    <div id="listWrap" data-page-node-id="sasYtdPc3c2t1ufZiZ8d7p"></div>
  </section>

  <!-- 原则库 -->
  <section id="principles" class="view" data-page-node-id="eu7SAykhw2HDQszEYatdka">
    <div class="hint" data-page-node-id="80Y4TFnugtIagLIThQRQ6N">原则会从「有偏差的复盘」一键提炼，也可手动添加。失效的原则标「已失效」而非删除——它曾成立过。</div>
    <label data-page-node-id="a2op6v8YEtTN6Q5Wxh4oX4">手动添加原则</label>
    <input type="text" id="newPrinciple" placeholder="例如：低频工具一律先做最小可用版，再谈扩展" data-page-node-id="umtSdQLPey8aHHox2DBHBU" />
    <div class="row" data-page-node-id="uNsmbbQF4EPD6GM816f3jX"><button class="btn" id="addPrinciple" data-page-node-id="rltTROrn4aHxwoGuELwtRK">加入原则库</button></div>
    <div id="principleWrap" style="margin-top:18px" data-page-node-id="u4zIVz2Z1oqkihTtoADOKs"></div>
  </section>

  <!-- 演化树 -->
  <section id="tree" class="view" data-page-node-id="n5NEZBWv3aANu7kv8BGuTH">
    <div class="hint" data-page-node-id="FAdvlhrLU52egsydFLAyPX">原则按时间排成时间线，像 commit 图一样看认知迭代。越往下越新。</div>
    <div class="tree" id="treeWrap" data-page-node-id="WJtxB8mXM6PpPOFGFeMbXl"></div>
  </section>

  <!-- 数据 -->
  <section id="data" class="view" data-page-node-id="G1CtbSmpLuDvlEMV0BAWoL">
    <div class="hint" data-page-node-id="0tJRVekPIlzy2oy95Vnook">数据只存在你这台浏览器里。定期导出以防清缓存丢失。</div>
    <div class="row" data-page-node-id="xLHFYPMJkD2AOiG5E0Cs5e">
      <button class="btn" id="exportBtn" data-page-node-id="DvgJgbEPMxGahWnyXPj5Cg">导出 JSON</button>
      <button class="btn ghost" id="importBtn" data-page-node-id="V6Mi4nqtAmqzBtN98ylIWC">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" data-page-node-id="A8CcSqlOjYOtt0M9OhVxIw" />
      <button class="btn ghost" id="clearBtn" data-page-node-id="B4x7WIOeBDPJIom9vGavpX">清空全部</button>
    </div>
    <p class="hint" id="dataStat" style="margin-top:16px" data-page-node-id="JQCWAnSQuE7jIr6YwLF0SI"></p>
  </section>
</main>

<script>
const KEY = "principle-retro-v1";
let state = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {reviews:[],principles:[]}; }
  catch(e){ return {reviews:[],principles:[]}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmt = (t)=> new Date(t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});

// nav
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(b.dataset.v).classList.add("active");
    if(b.dataset.v==="list") renderList();
    if(b.dataset.v==="principles") renderPrinciples();
    if(b.dataset.v==="tree") renderTree();
    if(b.dataset.v==="data") renderStat();
  };
});

// 偏差开关显隐痛苦卡
document.getElementById("deviation").onchange=(e)=>{
  document.getElementById("painBox").style.display = e.target.checked ? "block":"none";
};

// 保存复盘
document.getElementById("saveReview").onclick=()=>{
  const topic=document.getElementById("topic").value.trim();
  const deviation=document.getElementById("deviation").checked;
  const pain=document.getElementById("pain").value.trim();
  if(!topic){ alert("先写复盘主题"); return; }
  if(deviation && !pain){ alert("有偏差必须写反思才能提交（痛苦+反思=进步）"); return; }
  const r={ id:uid(), createdAt:Date.now(), topic,
    goal:val("goal"), problem:val("problem"), root:val("root"),
    plan:val("plan"), exec:val("exec"), deviation, pain };
  state.reviews.unshift(r);
  if(deviation && pain){ // 自动建议提炼
    state.principles.unshift({id:uid(),text:pain,sourceReviewId:r.id,
      status:"active",createdAt:Date.now(),fromPain:true});
  }
  save(); resetForm();
  alert(deviation?"复盘已存，反思已自动进原则库":"复盘已存");
};
function val(id){ return document.getElementById(id).value.trim(); }
function resetForm(){
  ["topic","goal","problem","root","plan","exec","pain"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("deviation").checked=false;
  document.getElementById("painBox").style.display="none";
}

// 列表
function renderList(){
  const w=document.getElementById("listWrap");
  if(!state.reviews.length){ w.innerHTML='<div class="empty">还没有复盘，去「复盘录入」写第一条。</div>'; return; }
  w.innerHTML=state.reviews.map(r=>`
    <div class="card">
      <strong>${esc(r.topic)}</strong>
      ${r.deviation?'<span class="pill dev">有偏差</span>':'<span class="pill ok">达标</span>'}
      <div class="meta">${fmt(r.createdAt)}</div>
      <div style="margin-top:8px;font-size:13px;color:var(--sub)">
        目标：${esc(r.goal)||"—"}<br>问题：${esc(r.problem)||"—"}<br>
        根因：${esc(r.root)||"—"}<br>方案：${esc(r.plan)||"—"}<br>执行：${esc(r.exec)||"—"}
      </div>
      ${r.deviation?`<div class="pain" style="margin-top:10px"><label>反思</label>${esc(r.pain)}</div>`:""}
    </div>`).join("");
}

// 原则库
document.getElementById("addPrinciple").onclick=()=>{
  const t=document.getElementById("newPrinciple").value.trim();
  if(!t) return;
  state.principles.unshift({id:uid(),text:t,sourceReviewId:null,status:"active",createdAt:Date.now(),fromPain:false});
  document.getElementById("newPrinciple").value=""; save(); renderPrinciples();
};
function renderPrinciples(){
  const w=document.getElementById("principleWrap");
  if(!state.principles.length){ w.innerHTML='<div class="empty">原则库空。有偏差的复盘会自动沉淀原则。</div>'; return; }
  w.innerHTML=state.principles.map(p=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <span>${esc(p.text)}</span>
        <button class="btn sm ghost" onclick="togglePrinciple('${p.id}')">
          ${p.status==="active"?"标记失效":"恢复有效"}</button>
      </div>
      <div class="meta">${fmt(p.createdAt)} · ${p.fromPain?"来自偏差复盘":"手动添加"} · ${p.status==="active"?'<span class="pill ok">有效</span>':'<span class="pill ob">已失效</span>'}</div>
    </div>`).join("");
}
function togglePrinciple(id){
  const p=state.principles.find(x=>x.id===id); if(!p) return;
  p.status = p.status==="active"?"obsolete":"active";
  save(); renderPrinciples();
}

// 演化树
function renderTree(){
  const w=document.getElementById("treeWrap");
  if(!state.principles.length){ w.innerHTML='<div class="empty">还没有原则可展示。</div>'; return; }
  w.innerHTML=state.principles.slice().reverse().map(p=>`
    <div class="node ${p.status!=="active"?"ob":""}">
      <div class="txt">${esc(p.text)}</div>
      <div class="d">${fmt(p.createdAt)} · ${p.fromPain?"偏差提炼":"手动"} · ${p.status==="active"?"有效":"已失效"}</div>
    </div>`).join("");
}

// 数据
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="principle-retro-"+new Date().toISOString().slice(0,10)+".json"; a.click();
};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{
    try{ const d=JSON.parse(rd.result); state={reviews:d.reviews||[],principles:d.principles||[]}; save(); alert("导入成功"); }
    catch(err){ alert("文件格式不对"); }
  }; rd.readAsText(f);
};
document.getElementById("clearBtn").onclick=()=>{
  if(confirm("确定清空全部复盘和原则？此操作不可恢复（建议先导出）。")){
    state={reviews:[],principles:[]}; save(); alert("已清空");
  }
};
function renderStat(){
  document.getElementById("dataStat").textContent=
    `当前：复盘 ${state.reviews.length} 条，原则 ${state.principles.length} 条（有效 ${state.principles.filter(p=>p.status==="active").length}）。`;
}
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
</script>
</body>
</html>
