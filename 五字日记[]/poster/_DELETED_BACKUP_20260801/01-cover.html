<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>五字日记 · 封面</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; user-select:none; }
html, body { width:1080px; height:1440px; overflow:hidden; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  background: linear-gradient(165deg, #fff9f2 0%, #ffefe6 35%, #ffe4d6 72%, #ffd6c4 100%);
  color: #4a3528;
  position: relative;
}
.bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
.blob-1 { width: 420px; height: 420px; background: #ffc8b0; top: -90px; left: -90px; opacity: .38; }
.blob-2 { width: 480px; height: 480px; background: #ffe0b3; bottom: -140px; right: -120px; opacity: .36; }
.blob-3 { width: 360px; height: 360px; background: #ffd4c8; top: 340px; left: 360px; opacity: .30; }
.poster { position: relative; width: 100%; height: 100%; z-index: 1; }
.header { text-align: center; padding-top: 66px; }
.icon-wrap { width: 92px; height: 92px; margin: 0 auto 16px; border-radius: 22px; background: #fff; padding: 8px; box-shadow: 0 14px 38px rgba(92, 60, 40, 0.12); }
.icon-wrap img { width: 76px; height: 76px; border-radius: 16px; display: block; }
h1 { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 80px; font-weight: 600; letter-spacing: 12px; line-height: 1; color: #4a3528; }
.subtitle { font-size: 26px; color: #8b6b55; margin-top: 14px; letter-spacing: 4px; }
.phones { position: relative; width: 1080px; height: 700px; margin-top: 20px; }
.phone { position: absolute; width: 292px; padding: 11px; background: #fff; border-radius: 42px; box-shadow: 0 30px 86px rgba(74, 45, 30, 0.17), 0 10px 26px rgba(74, 45, 30, 0.08); }
.phone-screen { width: 270px; height: 584px; border-radius: 34px; overflow: hidden; background: #faf8f6; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
.phone-screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
.phone-right .phone-screen img { filter: blur(1.1px); }
.phone-left { left: 110px; top: 120px; transform: rotate(-5deg); z-index: 1; }
.phone-right { right: 110px; top: 60px; transform: rotate(4deg); z-index: 2; }
.features { text-align: center; margin-top: 40px; }
.tags { display: flex; justify-content: center; gap: 16px; margin-bottom: 28px; }
.tag { padding: 10px 24px; border-radius: 30px; background: rgba(255, 255, 255, 0.58); border: 1px solid rgba(200, 168, 124, 0.28); font-size: 22px; color: #7a5d4a; letter-spacing: 1px; }
.cta { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 44px; font-weight: 600; color: #4a3528; letter-spacing: 3px; margin-bottom: 10px; }
.cta-sub { font-size: 22px; color: #9c7b64; letter-spacing: 2px; margin-bottom: 16px; }
.hashtags { font-size: 20px; color: #b08d75; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="poster">
    <div class="header">
      <div class="icon-wrap"><img src="../icons/icon_standalone_v2.png" alt="icon"></div>
      <h1>五字日记</h1>
      <div class="subtitle">每天五个字 · 留住今天的温度</div>
    </div>
    <div class="phones">
      <div class="phone phone-left">
        <div class="phone-screen"><img src="../poster-assets/home.png" alt="home"></div>
      </div>
      <div class="phone phone-right">
        <div class="phone-screen"><img src="../poster-assets/history.png" alt="history"></div>
      </div>
    </div>
    <div class="features">
      <div class="tags">
        <span class="tag">5字记录</span>
        <span class="tag">心情评分</span>
        <span class="tag">历史回看</span>
        <span class="tag">补记随心</span>
      </div>
      <div class="cta">把今天，写成五个字</div>
      <div class="cta-sub">像发朋友圈一样简单，心情会留下颜色</div>
      <div class="hashtags">#日记app &nbsp; #五字日记 &nbsp; #治愈系</div>
    </div>
  </div>
</body>
</html>
