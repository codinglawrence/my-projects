<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>五字日记 · 痛点共鸣</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; user-select:none; }
html, body { width:1080px; height:1440px; overflow:hidden; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  background: linear-gradient(160deg, #fff9f2 0%, #ffefe6 40%, #ffe4d6 100%);
  color: #4a3528;
  position: relative;
}
.bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
.blob-1 { width: 460px; height: 460px; background: #ffc8b0; top: -120px; right: -100px; opacity: .35; }
.blob-2 { width: 380px; height: 380px; background: #ffd4c8; bottom: -80px; left: -80px; opacity: .32; }
.poster { position: relative; width: 100%; height: 100%; z-index: 1; }
.topbar { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 70px; }
.topbar img { width: 58px; height: 58px; border-radius: 14px; box-shadow: 0 8px 24px rgba(92,60,40,0.10); }
.topbar span { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 28px; letter-spacing: 3px; color: #6b4f3d; }
.headline { text-align: center; margin-top: 58px; }
.headline h2 { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 64px; font-weight: 600; letter-spacing: 6px; line-height: 1.15; color: #4a3528; }
.headline p { font-size: 24px; color: #8b6b55; margin-top: 18px; letter-spacing: 2px; }
.phone-wrap { position: relative; width: 1080px; height: 680px; margin-top: 36px; display: flex; justify-content: center; align-items: flex-start; }
.phone { width: 300px; padding: 12px; background: #fff; border-radius: 44px; box-shadow: 0 34px 96px rgba(74, 45, 30, 0.18), 0 12px 32px rgba(74, 45, 30, 0.09); }
.phone-screen { width: 276px; height: 598px; border-radius: 36px; overflow: hidden; background: #faf8f6; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
.phone-screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
.solutions { display: flex; justify-content: center; gap: 22px; margin-top: 18px; }
.sol { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 30px; background: rgba(255,255,255,0.62); border: 1px solid rgba(200,168,124,0.28); font-size: 22px; color: #6b4f3d; }
.sol-dot { width: 10px; height: 10px; border-radius: 50%; background: #c8a87c; }
.bottom { text-align: center; margin-top: 54px; }
.bottom .cta { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 42px; font-weight: 600; letter-spacing: 3px; color: #4a3528; }
.bottom .sub { font-size: 22px; color: #9c7b64; margin-top: 10px; letter-spacing: 1px; }
.bottom .hashtags { font-size: 20px; color: #b08d75; margin-top: 18px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="poster">
    <div class="topbar"><img src="../icons/icon_standalone_v2.png" alt="icon"><span>五字日记</span></div>
    <div class="headline">
      <h2>写日记总坚持不下来？</h2>
      <p>每天 200 字太难，打开 Word 就犯困</p>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="phone-screen"><img src="../poster-assets/home.png" alt="home"></div>
      </div>
    </div>
    <div class="solutions">
      <div class="sol"><span class="sol-dot"></span>只写 5 个字</div>
      <div class="sol"><span class="sol-dot"></span>心情打个分</div>
      <div class="sol"><span class="sol-dot"></span>像翻朋友圈</div>
    </div>
    <div class="bottom">
      <div class="cta">让记录，比呼吸还简单</div>
      <div class="sub">再小的情绪，也值得被安放</div>
      <div class="hashtags">#自律 &nbsp; #日记 &nbsp; #情绪记录</div>
    </div>
  </div>
</body>
</html>
