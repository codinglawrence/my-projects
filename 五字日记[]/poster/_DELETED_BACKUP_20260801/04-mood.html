<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>五字日记 · 心情评分</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; user-select:none; }
html, body { width:1080px; height:1440px; overflow:hidden; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  background: linear-gradient(165deg, #fff9f2 0%, #ffefe6 35%, #ffe4d6 72%, #ffd6c4 100%);
  color: #4a3528;
  position: relative;
}
.bg-blob { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
.blob-1 { width: 460px; height: 460px; background: #ffc8b0; top: -120px; left: -100px; opacity: .34; }
.blob-2 { width: 420px; height: 420px; background: #ffd4c8; bottom: -100px; right: -80px; opacity: .32; }
.blob-3 { width: 320px; height: 320px; background: #ffe0b3; top: 420px; right: 240px; opacity: .26; }
.poster { position: relative; width: 100%; height: 100%; z-index: 1; }
.header { text-align: center; padding-top: 68px; }
.header h2 { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 60px; font-weight: 600; letter-spacing: 7px; color: #4a3528; }
.header p { font-size: 24px; color: #8b6b55; margin-top: 14px; letter-spacing: 3px; }
.phone-wrap { display: flex; justify-content: center; margin-top: 42px; }
.phone { width: 330px; padding: 13px; background: #fff; border-radius: 46px; box-shadow: 0 36px 100px rgba(74, 45, 30, 0.18), 0 12px 34px rgba(74, 45, 30, 0.09); }
.phone-screen { width: 304px; height: 658px; border-radius: 38px; overflow: hidden; background: #faf8f6; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
.phone-screen img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; transform: scale(1.28); display: block; }
.scale { width: 760px; margin: 50px auto 0; }
.scale-bar { height: 18px; border-radius: 9px; background: linear-gradient(to right, hsl(215,25%,82%), hsl(200,30%,78%), hsl(40,35%,80%), hsl(25,40%,75%), hsl(10,55%,70%)); box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); }
.scale-emoji { display: flex; justify-content: space-between; margin-top: 16px; font-size: 38px; }
.scale-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 20px; color: #8b6b55; }
.bottom { text-align: center; margin-top: 46px; }
.bottom .cta { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 44px; font-weight: 600; letter-spacing: 3px; color: #4a3528; }
.bottom .sub { font-size: 22px; color: #9c7b64; margin-top: 10px; letter-spacing: 1px; }
.bottom .hashtags { font-size: 20px; color: #b08d75; margin-top: 16px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="poster">
    <div class="header">
      <h2>心情，也是日记的一部分</h2>
      <p>0-10 分 · 11 个表情 · 从蓝灰到暖珊瑚</p>
    </div>
    <div class="phone-wrap">
      <div class="phone">
        <div class="phone-screen"><img src="../poster-assets/home.png" alt="mood"></div>
      </div>
    </div>
    <div class="scale">
      <div class="scale-bar"></div>
      <div class="scale-emoji"><span>😞</span><span>😕</span><span>😐</span><span>🙂</span><span>😄</span><span>🥰</span></div>
      <div class="scale-labels"><span>低落</span><span>一般</span><span>平静</span><span>不错</span><span>开心</span><span>极好</span></div>
    </div>
    <div class="bottom">
      <div class="cta">给今天打个分</div>
      <div class="sub">情绪的颜色，回头再看会讲话</div>
      <div class="hashtags">#情绪管理 &nbsp; #日记app &nbsp; #五字日记</div>
    </div>
  </div>
</body>
</html>
