<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>五字日记 · 金句收尾</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; user-select:none; }
html, body { width:1080px; height:1440px; overflow:hidden; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  background: linear-gradient(165deg, #fff9f2 0%, #ffefe6 40%, #ffe4d6 75%, #ffd6c4 100%);
  color: #4a3528;
  position: relative;
}
.bg-blob { position: absolute; border-radius: 50%; filter: blur(100px); pointer-events: none; }
.blob-1 { width: 520px; height: 520px; background: #ffc8b0; top: -160px; left: -120px; opacity: .36; }
.blob-2 { width: 480px; height: 480px; background: #ffe0b3; bottom: -160px; right: -120px; opacity: .34; }
.blob-3 { width: 300px; height: 300px; background: #ffd4c8; top: 520px; left: 280px; opacity: .24; }
.poster { position: relative; width: 100%; height: 100%; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.top-icon { margin-top: 86px; }
.top-icon img { width: 100px; height: 100px; border-radius: 24px; box-shadow: 0 16px 46px rgba(92,60,40,0.14); background: #fff; padding: 10px; }
.quote { text-align: center; margin-top: 58px; }
.quote h2 { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 76px; font-weight: 600; letter-spacing: 8px; line-height: 1.25; color: #4a3528; }
.quote p { font-size: 28px; color: #8b6b55; margin-top: 26px; letter-spacing: 3px; }
.phone { margin-top: 54px; width: 256px; padding: 10px; background: #fff; border-radius: 38px; box-shadow: 0 26px 72px rgba(74, 45, 30, 0.15), 0 9px 22px rgba(74, 45, 30, 0.07); }
.phone-screen { width: 236px; height: 510px; border-radius: 30px; overflow: hidden; background: #faf8f6; }
.phone-screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bottom { text-align: center; margin-top: 58px; }
.bottom .cta { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', 'STSong', serif; font-size: 42px; font-weight: 600; letter-spacing: 3px; color: #4a3528; }
.bottom .sub { font-size: 22px; color: #9c7b64; margin-top: 10px; letter-spacing: 1px; }
.bottom .hashtags { font-size: 20px; color: #b08d75; margin-top: 18px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="poster">
    <div class="top-icon"><img src="../icons/icon_standalone_v2.png" alt="icon"></div>
    <div class="quote">
      <h2>五个字，装得下<br>整个今天</h2>
      <p>不必写很多，只要今天被记住</p>
    </div>
    <div class="phone">
      <div class="phone-screen"><img src="../poster-assets/home.png" alt="home"></div>
    </div>
    <div class="bottom">
      <div class="cta">写下你的五个字</div>
      <div class="sub">从今天开始，让每天都有痕迹</div>
      <div class="hashtags">#五字日记 &nbsp; #日记app &nbsp; #关注获取更多模板</div>
    </div>
  </div>
</body>
</html>
